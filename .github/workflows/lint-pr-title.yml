name: Lint PR Title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  lint-pr-title:
    name: Validate Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title format
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const title = context.payload.pull_request.title;
            const pattern = /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?: .+/;

            if (!pattern.test(title)) {
              core.setFailed(
                `PR title does not follow Conventional Commits format.\n\n` +
                `Got: "${title}"\n\n` +
                `Expected: <type>(<optional scope>): <description>\n\n` +
                `Allowed types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert\n\n` +
                `Examples:\n` +
                `  feat: add calendar event support\n` +
                `  fix(auth): handle expired OAuth tokens\n` +
                `  chore!: drop Python 3.12 support`
              );
            }
