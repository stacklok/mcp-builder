[project]
name = "mcp-builder"
version = "0.1.0"
description = "A pipeline for generating ToolHive-ready MCP servers from OpenAPI specs."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jinja2>=3.1.6",
    "openapi-pydantic>=0.5.1",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "structlog>=25.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.12.9",
    "ty>=0.0.1a18",
]
security = [
    "bandit[toml]>=1.8.0",
    "pip-audit>=2.7.3",
    "cyclonedx-bom>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
# E2E output contains generated projects with their own dependencies.
exclude = ["e2e/output"]

[tool.ty.src]
# E2E tests are manual-run and import modules not available until codegen lands.
# Template fixture contains stub Python with deps not in our venv.
exclude = ["e2e", "tests/unit/fixtures/template/"]

[tool.bandit]
exclude_dirs = ["tests", "e2e"]

[tool.pytest.ini_options]
addopts = "--cov=mcp_builder --cov-report=html --cov-report=term-missing --ignore=e2e"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
