[project]
name = "mcp-builder"
version = "0.1.0"
description = "A pipeline for generating ToolHive-ready MCP servers from OpenAPI specs."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datamodel-code-generator[http]>=0.56.0",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.12.9",
    "ty>=0.0.1a18",
]
security = [
    "bandit[toml]>=1.8.0",
    "pip-audit>=2.7.3",
    "cyclonedx-bom>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
mcp-builder = "mcp_builder.cli:main"

[tool.ruff]
# Template fixtures contain intentional unused imports for scaffolding tests.
exclude = ["tests/unit/fixtures/template"]

[tool.ty.src]
# Template fixtures are not real source; exclude from type checking.
exclude = ["tests/unit/fixtures/template"]

[tool.bandit]
exclude_dirs = ["tests"]

[tool.pytest.ini_options]
addopts = "--cov=mcp_builder --cov-report=html --cov-report=term-missing"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
