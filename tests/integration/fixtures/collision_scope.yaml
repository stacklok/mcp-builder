version: "1"

server:
  name: collision-test
  description: "Name collision stress test server"

spec:
  source: "collision_openapi.yaml"
  format: openapi3
  base_url: "https://api.example.com"

groups:
  - name: collision-tests
    description: "Collision resolution tests"
    tools:
      - tool_name: get_resource
        endpoint: GET /resources/{id}
        description: "Cross-location and same-location collision test."
        response_kind: json
        parameters:
          - name: id
            description: "Resource ID."
            required: true
            location: path
          - name: id
            description: "Query ID filter."
            required: false
            location: query
          - name: foo-bar
            description: "Hyphenated param."
            required: false
            location: query
          - name: foo.bar
            description: "Dotted param."
            required: false
            location: query
      - tool_name: list_filters
        endpoint: GET /filters
        description: "Triple collision and keyword collision test."
        response_kind: json
        parameters:
          - name: a.b
            description: "Dotted."
            required: false
            location: query
          - name: a-b
            description: "Hyphenated."
            required: false
            location: query
          - name: a[b]
            description: "Bracketed."
            required: false
            location: query
          - name: from
            description: "Keyword param."
            required: false
            location: query
          - name: from_
            description: "Underscore-suffixed."
            required: false
            location: query

auth:
  type: none
