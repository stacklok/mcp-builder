openapi: "3.0.3"
info:
  title: Google Drive API (subset)
  version: v3
paths:
  /drive/v3/files:
    get:
      operationId: listFiles
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Drive search query string.
        - name: pageSize
          in: query
          schema:
            type: integer
          description: Maximum number of files to return.
        - name: pageToken
          in: query
          schema:
            type: string
          description: Token for continuing a previous list request.
        - name: fields
          in: query
          schema:
            type: string
          description: Selector specifying which fields to include.
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileList"
    post:
      operationId: createFile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFileRequest"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/File"
  /drive/v3/files/{fileId}:
    get:
      operationId: getFile
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the file.
        - name: fields
          in: query
          schema:
            type: string
          description: Selector specifying which fields to include.
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/File"
  /drive/v3/files/{fileId}/comments:
    parameters:
      - name: fileId
        in: path
        required: true
        schema:
          type: string
        description: The ID of the file.
    get:
      operationId: listComments
      parameters:
        - name: pageSize
          in: query
          schema:
            type: integer
          description: Maximum number of comments to return.
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentList"
    post:
      operationId: createComment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentRequest"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
components:
  schemas:
    File:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        mimeType:
          type: string
      required:
        - id
        - name
    FileList:
      type: object
      properties:
        files:
          type: array
          items:
            $ref: "#/components/schemas/File"
        nextPageToken:
          type: string
    CreateFileRequest:
      type: object
      properties:
        name:
          type: string
          description: The name of the file.
        mimeType:
          type: string
          description: The MIME type of the file.
        parents:
          type: array
          items:
            type: string
          description: Parent folder IDs.
      required:
        - name
        - mimeType
    Comment:
      type: object
      properties:
        id:
          type: string
        content:
          type: string
        author:
          type: string
      required:
        - id
        - content
    CommentList:
      type: object
      properties:
        comments:
          type: array
          items:
            $ref: "#/components/schemas/Comment"
        nextPageToken:
          type: string
    CreateCommentRequest:
      type: object
      properties:
        content:
          type: string
          description: The text content of the comment.
      required:
        - content
