openapi: "3.0.3"
info:
  title: Slack Web API (subset)
  version: v2
paths:
  /api/conversations.list:
    get:
      operationId: listChannels
      parameters:
        - name: types
          in: query
          schema:
            type: string
          description: Comma-separated channel types.
        - name: limit
          in: query
          schema:
            type: integer
          description: Number of channels to return.
        - name: cursor
          in: query
          schema:
            type: string
          description: Pagination cursor.
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelList"
  /api/conversations.info:
    get:
      operationId: getChannelInfo
      parameters:
        - name: channel
          in: query
          required: true
          schema:
            type: string
          description: The channel ID.
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
  /api/conversations.history:
    get:
      operationId: getChannelHistory
      parameters:
        - name: channel
          in: query
          required: true
          schema:
            type: string
          description: The channel ID.
        - name: limit
          in: query
          schema:
            type: integer
          description: Number of messages to return.
        - name: oldest
          in: query
          schema:
            type: string
          description: Only messages after this timestamp.
        - name: latest
          in: query
          schema:
            type: string
          description: Only messages before this timestamp.
        - name: cursor
          in: query
          schema:
            type: string
          description: Pagination cursor.
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageList"
  /api/search.messages:
    get:
      operationId: searchMessages
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
          description: Search query string.
        - name: count
          in: query
          schema:
            type: integer
          description: Number of results per page.
        - name: sort
          in: query
          schema:
            type: string
          description: Sort order.
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResult"
  /api/chat.postMessage:
    post:
      operationId: sendMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostMessageRequest"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /api/users.list:
    get:
      operationId: listUsers
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
          description: Number of users to return.
        - name: cursor
          in: query
          schema:
            type: string
          description: Pagination cursor.
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
  /api/users.profile.get:
    get:
      operationId: getUserProfile
      parameters:
        - name: user
          in: query
          required: true
          schema:
            type: string
          description: The user ID.
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
components:
  schemas:
    Channel:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        topic:
          type: string
      required:
        - id
        - name
    ChannelList:
      type: object
      properties:
        channels:
          type: array
          items:
            $ref: "#/components/schemas/Channel"
        response_metadata:
          type: object
          properties:
            next_cursor:
              type: string
    Message:
      type: object
      properties:
        ts:
          type: string
        text:
          type: string
        user:
          type: string
      required:
        - ts
        - text
    MessageList:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        has_more:
          type: boolean
    SearchResult:
      type: object
      properties:
        messages:
          type: object
          properties:
            total:
              type: integer
            matches:
              type: array
              items:
                $ref: "#/components/schemas/Message"
    PostMessageRequest:
      type: object
      properties:
        channel:
          type: string
          description: The channel or user ID.
        text:
          type: string
          description: The message text.
      required:
        - channel
        - text
    UserList:
      type: object
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/UserProfile"
    UserProfile:
      type: object
      properties:
        id:
          type: string
        real_name:
          type: string
        display_name:
          type: string
        email:
          type: string
      required:
        - id
