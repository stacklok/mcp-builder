version: "1"

server:
  name: test-api
  description: "Test API MCP server"

spec:
  source: "test_openapi.yaml"
  format: openapi3
  base_url: "https://api.example.com"
  total_endpoints: 2
  scoped_endpoints: 2

groups:
  - name: item-operations
    description: "Item CRUD operations"
    tools:
      - tool_name: get_item
        endpoint: GET /items/{itemId}
        description: "Get an item by its ID."
        parameters:
          - name: itemId
            description: "The unique item identifier."
            required: true
          - name: fields
            description: "Comma-separated list of fields to return."
            required: false
      - tool_name: create_item
        endpoint: POST /items
        description: "Create a new item."

auth:
  type: api_key
