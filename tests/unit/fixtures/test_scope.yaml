version: "1"

server:
  name: test-api
  description: "Test API MCP server"

spec:
  source: "test_openapi.yaml"
  format: openapi3
  base_url: "https://api.example.com"
  total_endpoints: 2
  scoped_endpoints: 2

groups:
  - name: item-operations
    description: "Item CRUD operations"
    tools:
      - tool_name: get_item
        endpoint: GET /items/{itemId}
        description: "Get an item by its ID."
        response_kind: json
        parameters:
          - name: itemId
            description: "The unique item identifier."
            required: true
            location: path
          - name: fields
            description: "Comma-separated list of fields to return."
            required: false
            location: query
      - tool_name: create_item
        endpoint: POST /items
        description: "Create a new item."
        response_kind: json
        parameters:
          - name: name
            description: "The name of the item."
            required: true
            location: body
          - name: description
            description: "Optional description."
            required: false
            location: body
      - tool_name: list_items
        endpoint: GET /items
        description: "List all items with optional filtering."
        response_kind: json
        parameters:
          - name: fields
            description: "Comma-separated list of fields to return."
            required: false
            location: query
          - name: status
            description: "Filter by item status."
            required: false
            location: query

auth:
  type: api_key
