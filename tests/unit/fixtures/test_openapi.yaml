openapi: "3.0.3"
info:
  title: "Test API"
  version: "1.0.0"
servers:
  - url: "https://api.example.com"
paths:
  /items/{itemId}:
    parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
        description: "The ID of the item."
    get:
      operationId: getItem
      summary: Get an item by ID
      parameters:
        - name: fields
          in: query
          required: false
          schema:
            type: string
          description: "Comma-separated fields to include."
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
  /items:
    post:
      operationId: createItem
      summary: Create a new item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateItemRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
  /repos/{owner}/{repo}/issues:
    parameters:
      - $ref: "#/components/parameters/owner"
    get:
      operationId: listIssues
      summary: List issues for a repository
      parameters:
        - name: repo
          in: path
          required: true
          schema:
            type: string
          description: "The name of the repository."
        - $ref: "#/components/parameters/per-page"
      responses:
        "200":
          description: Successful response
  /items-with-ref-body:
    post:
      operationId: createItemWithRefBody
      summary: Create an item using a $ref request body
      requestBody:
        $ref: "#/components/requestBodies/CreateItem"
      responses:
        "201":
          description: Created
components:
  parameters:
    owner:
      name: owner
      in: path
      required: true
      schema:
        type: string
      description: "The account owner of the repository."
    per-page:
      name: per_page
      in: query
      required: false
      schema:
        type: integer
      description: "Number of results per page."
  requestBodies:
    CreateItem:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CreateItemRequest"
  schemas:
    Item:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
      required:
        - id
        - name
    CreateItemRequest:
      type: object
      properties:
        name:
          type: string
          description: "The name of the item."
        description:
          type: string
          description: "Optional description."
      required:
        - name
