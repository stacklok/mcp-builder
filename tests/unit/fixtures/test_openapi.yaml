openapi: "3.0.3"
info:
  title: "Test API"
  version: "1.0.0"
servers:
  - url: "https://api.example.com"
paths:
  /items/{itemId}:
    parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
        description: "The ID of the item."
    get:
      operationId: getItem
      summary: Get an item by ID
      parameters:
        - name: fields
          in: query
          required: false
          schema:
            type: string
          description: "Comma-separated fields to include."
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
  /items:
    get:
      operationId: listItems
      summary: List all items
      parameters:
        - name: fields
          in: query
          required: false
          schema:
            type: string
          description: "Comma-separated fields to include."
        - name: status
          in: query
          required: false
          schema:
            type: string
          description: "Filter by status."
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
          description: "Sort field."
        - name: internalTraceId
          in: query
          required: false
          schema:
            type: string
          description: "Internal trace ID for debugging."
      responses:
        "200":
          description: Successful response
    post:
      operationId: createItem
      summary: Create a new item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateItemRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
  /repos/{owner}/{repo}/issues:
    parameters:
      - $ref: "#/components/parameters/owner"
    get:
      operationId: listIssues
      summary: List issues for a repository
      parameters:
        - name: repo
          in: path
          required: true
          schema:
            type: string
          description: "The name of the repository."
        - $ref: "#/components/parameters/per-page"
      responses:
        "200":
          description: Successful response
  /items-with-ref-body:
    post:
      operationId: createItemWithRefBody
      summary: Create an item using a $ref request body
      requestBody:
        $ref: "#/components/requestBodies/CreateItem"
      responses:
        "201":
          description: Created
  /items-with-ref-property:
    post:
      operationId: createItemWithRefProperty
      summary: Create an item whose body has a $ref property
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - item
              properties:
                item:
                  $ref: "#/components/schemas/Item"
                note:
                  type: string
                  description: "An optional note."
      responses:
        "201":
          description: Created
  /items-allof:
    post:
      operationId: createItemAllOf
      summary: Create item using allOf ($ref + inline)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/BaseItem"
                - type: object
                  properties:
                    priority:
                      type: integer
                      description: "Priority level"
                  required:
                    - priority
      responses:
        "201":
          description: Created
  /items-allof-refs:
    post:
      operationId: createItemAllOfRefs
      summary: Create item with allOf using only $refs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/BaseItem"
                - $ref: "#/components/schemas/PriorityMixin"
      responses:
        "201":
          description: Created
  /items-oneof:
    post:
      operationId: createItemOneOf
      summary: Create item with oneOf body
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  properties:
                    name:
                      type: string
                    color:
                      type: string
                - type: object
                  properties:
                    name:
                      type: string
                    size:
                      type: integer
      responses:
        "201":
          description: Created
  /items-anyof:
    post:
      operationId: createItemAnyOf
      summary: Create item with anyOf body
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
                - type: object
                  properties:
                    text:
                      type: string
                      description: "Plain text input"
                - type: object
                  properties:
                    html:
                      type: string
                      description: "HTML input"
      responses:
        "201":
          description: Created
  /files:
    post:
      operationId: createFile
      summary: Create file metadata (no requestBody defined)
      responses:
        "201":
          description: Created
  /files/{fileId}:
    put:
      operationId: updateFile
      summary: Replace file metadata (no requestBody defined)
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
          description: "The ID of the file."
      responses:
        "200":
          description: Updated
    patch:
      operationId: patchFile
      summary: Partially update file metadata (no requestBody defined)
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
          description: "The ID of the file."
      responses:
        "200":
          description: Updated
  /employees/{employeeId}/photo:
    get:
      operationId: getEmployeePhoto
      summary: Get an employee's photo (binary JPEG)
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: string
          description: "The employee ID."
      responses:
        "200":
          description: The employee photo.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
  /reports/{reportId}/download:
    get:
      operationId: downloadReport
      summary: Download a report with a mix of content types
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: string
          description: "The report ID."
      responses:
        "200":
          description: Report content.
          content:
            application/json:
              schema:
                type: object
            application/pdf:
              schema:
                type: string
                format: binary
  /shared-binary:
    get:
      operationId: getSharedBinary
      summary: Fetch a shared binary response via components.responses $ref
      responses:
        "200":
          $ref: "#/components/responses/BinaryImage"
  /files/{fileId}/comments:
    post:
      operationId: createComment
      summary: Create a comment (no requestBody defined)
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
          description: "The ID of the file."
      responses:
        "201":
          description: Created
components:
  parameters:
    owner:
      name: owner
      in: path
      required: true
      schema:
        type: string
      description: "The account owner of the repository."
    per-page:
      name: per_page
      in: query
      required: false
      schema:
        type: integer
      description: "Number of results per page."
  requestBodies:
    CreateItem:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CreateItemRequest"
  responses:
    BinaryImage:
      description: A shared binary image response definition.
      content:
        image/png:
          schema:
            type: string
            format: binary
  schemas:
    Item:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
      required:
        - id
        - name
    CreateItemRequest:
      type: object
      properties:
        name:
          type: string
          description: "The name of the item."
        description:
          type: string
          description: "Optional description."
      required:
        - name
    BaseItem:
      type: object
      properties:
        id:
          type: string
          description: "Base item ID"
        created_at:
          type: string
          description: "Creation timestamp"
      required:
        - id
    PriorityMixin:
      type: object
      properties:
        priority:
          type: integer
          description: "Priority level"
