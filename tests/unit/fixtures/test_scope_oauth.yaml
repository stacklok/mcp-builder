version: "1"

server:
  name: test-api
  description: "Test API MCP server with OAuth2"

spec:
  source: "test_openapi.yaml"
  format: openapi3
  base_url: "https://api.example.com"

groups:
  - name: item-operations
    description: "Item operations"
    tools:
      - tool_name: get_item
        endpoint: GET /items/{itemId}
        description: "Get an item by its ID."
        response_kind: json
        parameters:
          - name: itemId
            description: "The item identifier."
            required: true
            location: path

auth:
  type: oauth2
  flow: authorizationCode
  authorization_url: "https://auth.example.com/oauth/authorize"
  token_url: "https://auth.example.com/oauth/token"
  userinfo_url: "https://api.example.com/userinfo"
  external_url_template: "https://mcp.example.com/<server_name>"
  client_type: confidential
  scopes_available:
    read: "Read items"
    write: "Read and write items"
    admin: "Full admin access"
  scopes_required:
    - read
    - write
