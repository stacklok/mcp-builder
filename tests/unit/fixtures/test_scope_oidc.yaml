version: "1"

server:
  name: test-api
  description: "Test API MCP server with OIDC"

spec:
  source: "test_openapi.yaml"
  format: openapi3
  base_url: "https://api.example.com"

groups:
  - name: item-operations
    description: "Item operations"
    tools:
      - tool_name: get_item
        endpoint: GET /items/{itemId}
        description: "Get an item by its ID."
        response_kind: json
        parameters:
          - name: itemId
            description: "The item identifier."
            required: true
            location: path

auth:
  type: oidc
  issuer: "https://accounts.google.com"
  scopes_available:
    openid: "OpenID Connect sign-in"
    email: "User email"
  scopes_required:
    - openid
    - email
