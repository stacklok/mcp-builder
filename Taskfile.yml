version: '3'

tasks:
  install:
    desc: Install dependencies
    cmds:
      - uv sync --dev --all-packages --group security

  lint:
    desc: Run linting with ruff (read-only, no auto-fix)
    cmds:
      - uv run ruff check .
      - uv run ruff format --check .
    deps:
      - install

  format:
    desc: Fix linting issues and format code
    cmds:
      - uv run ruff check --fix .
      - uv run ruff format .
    deps:
      - install

  typecheck:
    desc: Run type checking with ty
    cmds:
      - uv run ty check .
    deps:
      - install

  test:
    desc: Run unit tests with pytest
    cmds:
      - uv run pytest -v
    deps:
      - install

  check:
    desc: Run all checks (lint, typecheck, tests, and security)
    cmds:
      - task: lint
      - task: typecheck
      - task: test
      - task: security

  security:
    desc: Run security scanning (generates reports, then fails on findings)
    cmds:
      - |
        bandit_exit=0
        audit_exit=0
        uv run bandit -c pyproject.toml -r src/ -f json -o bandit-report.json || bandit_exit=$?
        uv run pip-audit --format=json --output=pip-audit-report.json || audit_exit=$?
        uv run bandit -c pyproject.toml -r src/ || bandit_exit=$?
        uv run pip-audit || audit_exit=$?
        exit $((bandit_exit + audit_exit))
    deps:
      - install

  sbom:
    desc: Generate Software Bill of Materials (SBOM)
    cmds:
      - uv run cyclonedx-py environment --output-format json --output-file sbom.json
    deps:
      - install

  generate-schema:
    desc: Export mcp-scope.yaml JSON schema from Pydantic models
    cmds:
      - uv run python -c "from mcp_builder.schema.models import MCPScope; import json, pathlib; p = pathlib.Path('docs/mcp-scope-schema.json'); p.parent.mkdir(parents=True, exist_ok=True); p.write_text(json.dumps(MCPScope.model_json_schema(), indent=2) + '\n'); print(p.resolve())"
    deps:
      - install
